name: Order Booking APK

# Builds a sideloadable Android APK for apps/order-booking/mobile and attaches
# it to the run as a downloadable artifact.
#
# This lives in CI rather than being built locally because the Android SDK is
# only served from dl.google.com, which the dev container's network policy
# blocks. GitHub's runners can reach it.

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Server address the app should talk to (changeable later in Settings)"
        required: false
        default: "https://orders.ecoobasketb2b.com"
  push:
    paths:
      - "apps/order-booking/mobile/**"
      - ".github/workflows/order-booking-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/order-booking/mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      # The android/ platform shell is not checked in — only lib/, test/ and
      # pubspec.yaml are. It is generated in a scratch directory and copied in,
      # rather than `flutter create .` over the real project, so the template
      # can never overwrite lib/main.dart or analysis_options.yaml.
      - name: Generate the Android platform shell
        run: |
          shell_dir="$(mktemp -d)/shell"
          flutter create --platforms=android \
            --org com.ecoobasket --project-name ecoo_order_booking "$shell_dir"
          cp -r "$shell_dir/android" ./android

      - name: Set the app label and the permissions sync needs
        run: |
          python3 - <<'PY'
          import pathlib, re
          manifest = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          xml = manifest.read_text()

          # INTERNET carries sync and the Excel download; ACCESS_NETWORK_STATE
          # is what connectivity_plus reads to notice signal coming back.
          perms = ["android.permission.INTERNET",
                   "android.permission.ACCESS_NETWORK_STATE"]
          missing = [p for p in perms if p not in xml]
          if missing:
              lines = "\n".join(f'    <uses-permission android:name="{p}"/>'
                                for p in missing)
              xml = re.sub(r"(<manifest\b[^>]*>)", r"\1\n" + lines, xml, count=1)

          xml = xml.replace('android:label="ecoo_order_booking"',
                            'android:label="Ecoo Orders"')
          manifest.write_text(xml)
          print(xml.split("<application")[0])
          PY

      - run: flutter pub get

      # Analyze and test before building: a red APK is worse than no APK.
      - run: flutter analyze
      - run: flutter test

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=ECOO_API_BASE_URL="${{ inputs.api_base_url || 'https://orders.ecoobasketb2b.com' }}"

      - name: Report size
        run: ls -lh build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ecoo-order-booking-apk
          path: apps/order-booking/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error
