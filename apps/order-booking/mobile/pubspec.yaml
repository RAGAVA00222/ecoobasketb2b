name: ecoo_order_booking
description: Ecoo Basket — FMCG order booking for field sales. Offline first.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  # State. Riverpod keeps the order draft outside the widget tree so the
  # product list never rebuilds when a single quantity changes.
  flutter_riverpod: ^2.5.1
  # Offline store. Every read the salesman makes hits SQLite, never the network.
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  http: ^1.2.2
  connectivity_plus: ^6.0.5
  cached_network_image: ^3.4.1
  intl: ^0.19.0
  uuid: ^4.5.1
  share_plus: ^10.0.2
  # No google_fonts on purpose: it fetches font files at first paint, which is
  # exactly the wrong trade for an offline-first app with a 2s launch budget.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
